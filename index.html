<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON DRIFT — Endless Arcade</title>
<style>
:root{color-scheme:dark;--mint:#a7ffd0;--line:#303e4c;--muted:#8495a6}
*{box-sizing:border-box}
body{margin:0;background:#0b1018;color:#eef5f6;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:24px}
button{font:inherit;cursor:pointer;color:inherit}
.app{width:min(1120px,100%)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{font-size:20px;font-weight:900;letter-spacing:3px}.brand span{color:var(--mint)}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:7px}
.tools{display:flex;gap:8px}.tool{background:#151e29;border:1px solid var(--line);padding:10px 13px;font-size:11px;border-radius:5px}
.tool:hover{border-color:var(--mint);color:var(--mint)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#151d28;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;padding:17px 22px;gap:10px}
.label{font-size:9px;color:var(--muted);letter-spacing:1.8px;margin-bottom:7px}
.value{font-size:19px;font-weight:bold;letter-spacing:2px}
#health{color:var(--mint)}#sector{color:#ffcc82}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);background:#080e19;aspect-ratio:16/10;max-height:68vh;min-height:260px}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0px,transparent 3px,#00000015 4px);opacity:.55}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#070e1abc;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.panel{width:min(580px,100%);text-align:center}
.tag{display:inline-block;border:1px solid #48685c;background:#a7ffd00c;color:var(--mint);padding:7px 11px;font-size:10px;letter-spacing:2px}
h1{font-size:clamp(33px,6vw,68px);line-height:1.02;letter-spacing:-3px;margin:22px 0 15px;text-shadow:4px 4px 0 #34545c}
h1 em{font-style:normal;color:var(--mint)}
.desc{color:#aebfcd;font-size:12px;line-height:1.9;max-width:470px;margin:0 auto 22px}
.primary{background:var(--mint);color:#11251c;border:0;box-shadow:4px 4px 0 #496c5c;padding:15px 29px;font-weight:900;letter-spacing:1px}
.primary:hover{background:#ceffe4;transform:translateY(-1px)}
.hint{font-size:10px;color:#91a5b9;margin-top:22px;line-height:1.8}
.cards{display:flex;gap:10px;margin-top:20px}
.card{flex:1;border:1px solid #455769;background:#142231;padding:20px 12px;text-align:left;border-radius:6px}
.card:hover{border-color:var(--mint);background:#203849}
.card b{display:block;color:var(--mint);font-size:13px;margin:10px 0}
.card small{color:#adc0d1;font-size:10px;line-height:1.7;display:block}
.card .icon{font-size:24px;color:#ffcb85}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;font-size:10px;line-height:1.8;color:var(--muted)}
kbd{display:inline-block;padding:2px 5px;border:1px solid #354253;border-radius:3px;color:#cddbe6;font:inherit}
.live{color:var(--mint)}.mobile{display:flex;gap:7px}.mobile button{background:#151e29;border:1px solid #3b4f60;padding:9px 13px;border-radius:5px;font-size:10px}
#toast{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none;font-size:12px;letter-spacing:3px;color:#c8ffe3;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .25s}
@media(max-width:640px){body{padding:10px}.brand{font-size:16px}.eyebrow{font-size:8px}.tool{font-size:9px;padding:8px}.hud{padding:12px;grid-template-columns:1.1fr 1fr 1fr}.bestBox{display:none}.value{font-size:15px}.stage{aspect-ratio:4/5;max-height:none}.cards{gap:6px}.card{padding:12px 8px}.card b{font-size:11px}.desc{font-size:11px;margin-bottom:15px}h1{margin:15px 0}.hint{margin-top:15px}footer{align-items:flex-start}.desktopHint{max-width:210px}}
</style>
</head>
<body>
<main class="app">
<header>
<div><div class="brand">NEON<span> / </span>DRIFT</div><div class="eyebrow">ENDLESS SECTORS · ONE LITTLE SHIP</div></div>
<div class="tools"><button class="tool" id="sound">SOUND OFF</button><button class="tool" id="pause">Ⅱ PAUSE</button></div>
</header>
<section class="hud">
<div><div class="label">HULL INTEGRITY</div><div class="value" id="health">♥ ♥ ♥ ♥ ♥</div></div>
<div><div class="label" id="zone">01 / VERDANT VOID</div><div class="value" id="sector">SECTOR 01</div></div>
<div><div class="label">SCORE</div><div class="value" id="score">000000</div></div>
<div class="bestBox"><div class="label">PERSONAL BEST</div><div class="value" id="best">000000</div></div>
</section>
<div class="stage">
<canvas id="game" width="960" height="600" tabindex="0" aria-label="Neon Drift arcade shooter. Move with WASD or arrows, Space to dash, X for nova, P to pause."></canvas>
<div class="scanlines"></div><div id="toast"></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
</div>
<footer>
<div class="desktopHint"><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> move &nbsp; <kbd>SPACE</kbd> dash &nbsp; <kbd>X</kbd> nova<br><span class="live">● AUTO-FIRE ON</span> &nbsp; Drag ship on touch · <kbd>P</kbd> pause</div>
<div class="mobile"><button id="dash">DASH · READY</button><button id="nova">NOVA · 1</button></div>
</footer>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=960,H=600,TAU=Math.PI*2;
const themes=[
 {name:'VERDANT VOID',bg:'#07161b',grid:'#12343b',accent:'#a7ffd0',enemy:'#ffad86',type:0},
 {name:'VIOLET CIRCUIT',bg:'#130d25',grid:'#34204b',accent:'#c1a4ff',enemy:'#ffdb7d',type:1},
 {name:'RUST FRONTIER',bg:'#24110e',grid:'#49281d',accent:'#ffbb7e',enemy:'#84e3ee',type:2},
 {name:'GLACIAL SIGNAL',bg:'#091925',grid:'#153c50',accent:'#88e8ff',enemy:'#ff8ea6',type:3},
 {name:'CRIMSON ECHO',bg:'#200e20',grid:'#44203d',accent:'#ff91c8',enemy:'#dbfc99',type:4}
];
const ship=['0001000','0001000','0011100','1011101','1111111','1101011','1000001'];
const bugs=[
 ['0100010','0010100','0111110','1101011','1111111','0100010','1000001'],
 ['0001000','0011100','1111111','1101011','0111110','0010100','0100010'],
 ['1000001','1100011','0111110','1101011','1111111','0011100','0100010'],
 ['0011100','0111110','1101011','1111111','0111110','0101010','1000001']
];
let state='title',beforePause='play',t=0,last=0,level=1,score=0,best=0,theme=themes[0];
try{best=Number(localStorage.getItem('neondrift.best'))||0}catch(e){}
let p,foes=[],shots=[],hostile=[],particles=[],drops=[],keys={},pointer=null;
let spawned=0,total=0,spawnTimer=0,shootTimer=0,clearTimer=0,shake=0,flash=0,toastTimer=0;
let audio=null,sound=false;
const stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,z:1+Math.random()*2}));
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=(n,l=6)=>String(Math.floor(n)).padStart(l,'0');
function tone(freq,dur=.08,type='square',vol=.025){
 if(!sound)return;
 try{
 audio=audio||new(window.AudioContext||window.webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
 const o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
 o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.5),audio.currentTime+dur);
 g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
 o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
 }catch(e){}
}
function show(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}
function hide(){$('overlay').classList.add('hidden')}
function toast(s){$('toast').textContent=s;toastTimer=2.7;$('toast').style.opacity=1}
function hud(){
 $('health').textContent=p?'♥'.repeat(p.hp)+'·'.repeat(p.max-p.hp):'♥ ♥ ♥ ♥ ♥';
 $('score').textContent=pad(score);$('best').textContent=pad(best);
 $('sector').textContent='SECTOR '+pad(level,2);
 $('zone').textContent=pad((level-1)%5+1,2)+' / '+theme.name;
 $('dash').textContent='DASH · '+(p&&p.dashCD>0?Math.ceil(p.dashCD)+'s':'READY');
 $('nova').textContent='NOVA · '+(p?p.nova:1);
}
function title(){
 show('<span class="tag">ARCADE SURVIVAL / ∞ SECTORS</span><h1>SMALL SHIP.<br><em>BIG TROUBLE.</em></h1><p class="desc">Carve a path through an endless pixel cosmos.<br>Shifting worlds. Unpredictable swarms. No final level.</p><button class="primary" id="start">LAUNCH RUN →</button><div class="hint">Your guns fire automatically. You do the dodging.<br>Choose an upgrade each sector. A guardian awaits every fifth.</div>');
 $('start').onclick=start;
}
function start(){
 p={x:W/2,y:H-85,hp:5,max:5,inv:2,dashCD:0,dashTime:0,dx:0,dy:-1,nova:1,power:1,rate:.18,spread:0};
 score=0;level=1;shots=[];hostile=[];particles=[];drops=[];shake=0;flash=0;pointer=null;keys={};
 hide();state='play';begin();canvas.focus();
}
function begin(){
 theme=themes[(level-1)%themes.length];document.documentElement.style.setProperty('--mint',theme.accent);
 foes=[];hostile=[];shots=[];drops=[];spawned=0;total=level%5===0?1:Math.min(34,8+level*2);
 spawnTimer=1.4;shootTimer=.15;clearTimer=0;p.inv=Math.max(p.inv,1.6);
 toast(level%5===0?'⚠ SECTOR '+pad(level,2)+' / GUARDIAN APPROACHING':'SECTOR '+pad(level,2)+' / '+theme.name);hud();
}
function burst(x,y,color,n=16){
 for(let i=0;i<n;i++){let a=rand(0,TAU),s=rand(30,180);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.65),color,size:rand(2,5)})}
}
function spawn(){
 if(level%5===0){
 const hp=60+level*13;
 foes.push({x:W/2,y:-70,base:W/2,r:52,hp,max:hp,boss:true,age:0,cd:1.2,phase:0,type:3,speed:40});return;
 }
 let type=Math.floor(rand(0,Math.min(4,1+Math.ceil(level/2))));
 const hp=type===3?3+Math.floor(level/5):1+Math.floor(level/6);
 let x=rand(75,W-75);
 foes.push({x,y:-30,base:x,r:type===3?20:16,hp,max:hp,type,age:0,cd:rand(1.4,3),speed:Math.min(145,40+level*3)+rand(0,18),phase:rand(0,TAU)});
}
function enemyBullet(e,angle,speed=150){
 hostile.push({x:e.x,y:e.y+10,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:4});
}
function kill(e){
 if(e.dead)return;e.dead=true;score+=e.boss?1500+level*100:80+e.type*35;
 burst(e.x,e.y,e.boss?theme.accent:theme.enemy,e.boss?75:20);tone(e.boss?90:160,.12,'sawtooth');
 shake=e.boss?12:3;
 if(Math.random()<.09&&!e.boss)drops.push({x:e.x,y:e.y,r:10});
}
function damage(){
 if(p.inv>0||state!=='play')return;
 p.hp--;p.inv=1.7;shake=10;flash=.16;tone(65,.2,'sawtooth',.05);burst(p.x,p.y,'#ffffff',18);
 if(p.hp<=0)gameover();hud();
}
function gameover(){
 state='over';burst(p.x,p.y,theme.accent,70);best=Math.max(best,score);
 try{localStorage.setItem('neondrift.best',best)}catch(e){}
 show('<span class="tag">SIGNAL LOST</span><h1>GOOD RUN,<br><em>PILOT.</em></h1><p class="desc">Score '+pad(score)+' &nbsp; / &nbsp; Sector '+pad(level,2)+'<br>Personal best '+pad(best)+'</p><button class="primary" id="retry">ONE MORE RUN →</button><div class="hint">Tip: dash through danger. Nova clears nearby enemies<br>and every hostile bullet on screen.</div>');
 $('retry').onclick=start;
}
function upgrade(){
 state='upgrade';p.nova=Math.min(3,p.nova+1);p.dashCD=0;
 const choices=[
 {icon:'↟',name:'HOT BARRELS',desc:'+25% shot damage',apply:()=>p.power*=1.25},
 {icon:'»',name:'RAPID RELAY',desc:p.rate>.072?'15% faster firing':'+25% shot damage',apply:()=>p.rate>.072?p.rate=Math.max(.07,p.rate*.85):p.power*=1.25},
 {icon:'♥',name:'FIELD REPAIR',desc:p.hp<p.max?'Restore 2 hull points':'+1 maximum hull & heal 1',apply:()=>{if(p.hp<p.max)p.hp=Math.min(p.max,p.hp+2);else{p.max=Math.min(9,p.max+1);p.hp=p.max}}}
 ];
 if(level%3===0&&p.spread<2)choices[1]={icon:'⋔',name:'SPLIT SIGNAL',desc:'Add two angled projectiles',apply:()=>p.spread++};
 show('<span class="tag">SECTOR '+pad(level,2)+' CLEARED</span><h1 style="font-size:40px">MAKE IT <em>LOUDER.</em></h1><p class="desc">One upgrade. Then back into the void.<br>+1 nova charge · Dash recharged</p><div class="cards">'+choices.map((c,i)=>'<button class="card" id="up'+i+'"><span class="icon">'+c.icon+'</span><b>'+c.name+'</b><small>'+c.desc+'</small></button>').join('')+'</div>');
 choices.forEach((c,i)=>$('up'+i).onclick=()=>{c.apply();level++;state='play';hide();begin();canvas.focus();tone(660,.15,'triangle')});
}
function dash(){
 if(state!=='play'||p.dashCD>0)return;
 let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 let dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 if(pointer){dx=pointer.x-p.x;dy=pointer.y-p.y}
 let d=Math.hypot(dx,dy);p.dx=d>1?dx/d:0;p.dy=d>1?dy/d:-1;
 p.dashTime=.19;p.dashCD=3;p.inv=Math.max(p.inv,.45);tone(280,.16,'triangle');
}
function nova(){
 if(state!=='play'||p.nova<1)return;
 p.nova--;hostile=[];flash=.3;shake=8;
 for(const e of foes){e.hp-=18*p.power;if(e.hp<=0)kill(e)}
 burst(p.x,p.y,theme.accent,100);tone(55,.45,'sawtooth',.06);hud();
}
function togglePause(){
 if(state==='play'){beforePause=state;state='pause';keys={};pointer=null;show('<span class="tag">TRANSMISSION HELD</span><h1>TAKE A <em>BREATH.</em></h1><p class="desc">The universe can wait.</p><button class="primary" id="resume">RESUME →</button>');$('resume').onclick=togglePause;$('pause').textContent='▶ RESUME'}
 else if(state==='pause'){state=beforePause;hide();canvas.focus();$('pause').textContent='Ⅱ PAUSE'}
}
$('pause').onclick=togglePause;$('dash').onclick=dash;$('nova').onclick=nova;
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='SOUND '+(sound?'ON':'OFF');tone(540,.1,'triangle')};
document.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys[e.code]=true;
 if(!e.repeat){if(e.code==='Space')dash();if(e.code==='KeyX')nova();if(e.code==='KeyP'||e.code==='Escape')togglePause()}
});
document.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('blur',()=>{keys={};pointer=null;if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(state==='play'){pointer=point(e);canvas.setPointerCapture(e.pointerId);canvas.focus()}});
canvas.addEventListener('pointermove',e=>{if(pointer)pointer=point(e)});
canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);
function update(dt){
 t+=dt;shake=Math.max(0,shake-dt*28);flash=Math.max(0,flash-dt);
 toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;
 for(const s of stars){s.y+=dt*s.z*18;if(s.y>H){s.y=0;s.x=rand(0,W)}}
 particles=particles.filter(a=>{a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;return a.life>0});
 if(state!=='play')return;
 p.inv=Math.max(0,p.inv-dt);p.dashCD=Math.max(0,p.dashCD-dt);
 if(p.dashTime>0){p.x+=p.dx*850*dt;p.y+=p.dy*850*dt;p.dashTime-=dt;burst(p.x,p.y,theme.accent,2)}
 else{
 let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 let d=Math.hypot(dx,dy);
 if(d){p.x+=dx/d*300*dt;p.y+=dy/d*300*dt}
 else if(pointer){dx=pointer.x-p.x;dy=pointer.y-p.y;d=Math.hypot(dx,dy);if(d>2){const move=Math.min(d,400*dt);p.x+=dx/d*move;p.y+=dy/d*move}}
 }
 p.x=clamp(p.x,22,W-22);p.y=clamp(p.y,35,H-24);
 shootTimer-=dt;
 if(shootTimer<=0){
 shootTimer=p.rate;
 for(let i=-p.spread;i<=p.spread;i++){let a=-Math.PI/2+i*.13;shots.push({x:p.x,y:p.y-18,vx:Math.cos(a)*540,vy:Math.sin(a)*540,damage:p.power*(i===0?1:.65)})}
 tone(820,.035,'square',.008);
 }
 spawnTimer-=dt;
 if(spawned<total&&spawnTimer<=0){spawn();spawned++;spawnTimer=Math.max(.27,.85-level*.025)}
 for(const e of foes){
 if(e.dead)continue;e.age+=dt;
 if(e.boss){
 e.y=Math.min(105,e.y+55*dt);e.x=W/2+Math.sin(e.age*.65)*290;
 }else{
 e.y+=e.speed*dt;
 if(e.type===0)e.x=e.base+Math.sin(e.age*2+e.phase)*32;
 if(e.type===1)e.x=e.base+Math.sin(e.age*3+e.phase)*105;
 if(e.type===2){e.x+=clamp(p.x-e.x,-70,70)*dt;e.y+=Math.max(0,Math.sin(e.age*3))*65*dt}
 if(e.type===3)e.x=e.base+Math.sin(e.age*1.3+e.phase)*155;
 e.x=clamp(e.x,22,W-22);
 }
 e.cd-=dt;
 if(e.cd<=0&&e.y>20&&e.y<H-70){
 const angle=Math.atan2(p.y-e.y,p.x-e.x);
 if(e.boss){
 const count=7;for(let j=0;j<count;j++)enemyBullet(e,Math.PI/2+(j-3)*.24+Math.sin(e.age)*.2,Math.min(230,135+level*3));
 enemyBullet(e,angle,180);e.cd=Math.max(.5,1.15-level*.012);
 }else{
 if(level>=2||e.type===3)enemyBullet(e,angle,Math.min(245,110+level*5));
 e.cd=rand(1.8,3.2);
 }
 }
 if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+10){damage();if(!e.boss)e.dead=true}
 if(e.y>H+50)e.dead=true;
 }
 for(const b of shots){
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 for(const e of foes)if(!e.dead&&Math.abs(b.x-e.x)<e.r+3&&Math.abs(b.y-e.y)<e.r+8){e.hp-=b.damage;b.dead=true;burst(b.x,b.y,theme.accent,3);if(e.hp<=0)kill(e);break}
 }
 for(const b of hostile){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-p.x,b.y-p.y)<13){b.dead=true;damage()}}
 for(const d of drops){d.y+=75*dt;if(Math.hypot(d.x-p.x,d.y-p.y)<26){p.hp=Math.min(p.max,p.hp+1);d.dead=true;tone(620,.1,'triangle');burst(d.x,d.y,'#a7ffd0',10)}}
 shots=shots.filter(b=>!b.dead&&b.y>-30&&b.x>-20&&b.x<W+20);
 hostile=hostile.filter(b=>!b.dead&&b.y<H+30&&b.y>-30&&b.x>-30&&b.x<W+30);
 foes=foes.filter(e=>!e.dead);drops=drops.filter(d=>!d.dead&&d.y<H+20);
 if(spawned===total&&foes.length===0&&state==='play'){clearTimer+=dt;if(clearTimer>1.1)upgrade()}
 hud();
}
function sprite(pattern,x,y,color,scale=4){
 ctx.fillStyle=color;const h=pattern.length,w=pattern[0].length;
 for(let row=0;row<h;row++)for(let col=0;col<w;col++)if(pattern[row][col]==='1')ctx.fillRect(Math.round(x+(col-w/2)*scale),Math.round(y+(row-h/2)*scale),scale,scale);
}
function background(){
 ctx.fillStyle=theme.bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle=theme.grid;ctx.lineWidth=1;
 const offset=t*22%64;
 ctx.beginPath();
 if(theme.type===0){for(let x=0;x<W;x+=64){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=offset;y<H;y+=64){ctx.moveTo(0,y);ctx.lineTo(W,y)}}
 if(theme.type===1){for(let x=-H;x<W+H;x+=80){ctx.moveTo(x+offset,0);ctx.lineTo(x+offset+H,H)}for(let y=offset;y<H;y+=80){ctx.moveTo(0,y);ctx.lineTo(W,y)}}
 if(theme.type===2){for(let y=offset-64;y<H;y+=64)for(let x=0;x<W;x+=128){let a=x+(Math.floor(y/64)%2)*64;ctx.rect(a,y,110,47)}}
 if(theme.type===3){for(let x=40;x<W;x+=90)for(let y=offset-64;y<H;y+=90){ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8)}}
 if(theme.type===4){for(let x=0;x<W;x+=96){ctx.moveTo(x,0);ctx.lineTo(x,H);for(let y=offset;y<H;y+=96){ctx.moveTo(x,y);ctx.lineTo(x+36,y);ctx.lineTo(x+60,y+24)}}}
 ctx.stroke();
 for(const s of stars){ctx.globalAlpha=.2+s.z*.17;ctx.fillStyle='#d4eef7';ctx.fillRect(Math.floor(s.x),Math.floor(s.y),s.z>2?2:1,s.z>2?2:1)}ctx.globalAlpha=1;
 const shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#00000000');shade.addColorStop(1,'#02061085');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
}
function draw(){
 ctx.save();ctx.translate(shake?rand(-shake,shake):0,shake?rand(-shake,shake):0);background();
 if(state==='title'){
 for(let i=0;i<6;i++)sprite(bugs[i%4],110+i*145,100+Math.sin(t+i)*25,theme.enemy,4);
 sprite(ship,W/2,H-90,theme.accent,5);
 }else{
 for(const b of shots){ctx.fillStyle='#effff7';ctx.fillRect(b.x-2,b.y-8,4,16);ctx.fillStyle=theme.accent;ctx.fillRect(b.x-1,b.y+7,2,9)}
 for(const e of foes){
 sprite(bugs[e.type],e.x,e.y,e.boss?theme.accent:theme.enemy,e.boss?13:e.type===3?5:4);
 if(e.boss){
 ctx.fillStyle='#101b27';ctx.fillRect(W/2-180,22,360,9);ctx.fillStyle=theme.enemy;ctx.fillRect(W/2-180,22,360*Math.max(0,e.hp/e.max),9);
 ctx.fillStyle='#eef2f8';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('SECTOR GUARDIAN',W/2,46);
 }else if(e.hp<e.max){ctx.fillStyle=theme.enemy;ctx.fillRect(e.x-15,e.y-e.r-9,30*Math.max(0,e.hp/e.max),3)}
 }
 for(const b of hostile){ctx.fillStyle='#ff637d';ctx.fillRect(b.x-5,b.y-5,10,10);ctx.fillStyle='#ffe4b4';ctx.fillRect(b.x-2,b.y-2,4,4)}
 for(const d of drops){ctx.fillStyle='#133b32';ctx.fillRect(d.x-10,d.y-10,20,20);ctx.fillStyle='#a7ffd0';ctx.fillRect(d.x-2,d.y-7,4,14);ctx.fillRect(d.x-7,d.y-2,14,4)}
 if(p&&state!=='over'){
 ctx.fillStyle=t%0.12<.06?'#ffd18c':'#ff7d65';ctx.fillRect(p.x-5,p.y+12,10,10+Math.random()*15);
 if(p.inv<=0||Math.floor(t*16)%2===0)sprite(ship,p.x,p.y,theme.accent,4);
 if(p.inv>0){ctx.strokeStyle=theme.accent+'60';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,25,0,TAU);ctx.stroke()}
 }
 }
 for(const a of particles){ctx.globalAlpha=Math.min(1,a.life*3);ctx.fillStyle=a.color;ctx.fillRect(a.x,a.y,a.size,a.size)}ctx.globalAlpha=1;
 if(flash>0){ctx.fillStyle='rgba(210,255,238,'+Math.min(.45,flash*1.5)+')';ctx.fillRect(0,0,W,H)}
 if(state==='play'){
 ctx.fillStyle='#7a98a8';ctx.textAlign='left';ctx.font='10px monospace';ctx.fillText('DRIFT ENGINE // '+theme.name,20,H-18);
 const progress=spawned===total?(total-foes.length)/total:Math.max(0,(spawned-foes.length)/total);
 ctx.fillStyle='#263746';ctx.fillRect(W-170,H-22,150,4);ctx.fillStyle=theme.accent;ctx.fillRect(W-170,H-22,150*progress,4);
 }
 ctx.restore();
}
function loop(now){
 const dt=Math.min(.033,(now-last)/1000||.016);last=now;
 if(state!=='pause')update(dt);draw();requestAnimationFrame(loop);
}
hud();title();requestAnimationFrame(loop);
})();
</script>
